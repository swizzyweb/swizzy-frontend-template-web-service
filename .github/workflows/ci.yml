name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t swizzy-frontend-template-web-service:${{ github.sha }} .
